name: PulseView xLOGIC Windows build
on: workflow_dispatch

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: alambe94/libsigrok
          ref: 398517bb2d2e5f7298c1f23eb8fc1a10bfd78ddd
          path: libsigrok-src
          persist-credentials: false
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            autoconf automake libtool make autoconf-archive
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-glibmm mingw-w64-ucrt-x86_64-libusb
            mingw-w64-ucrt-x86_64-libzip mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-qt5-base mingw-w64-ucrt-x86_64-qt5-svg
            mingw-w64-ucrt-x86_64-qt5-tools mingw-w64-ucrt-x86_64-doxygen
      - name: Build the xLOGIC driver and C++ bindings
        run: |
          set -eu
          cd libsigrok-src
          NOCONFIGURE=1 ./autogen.sh
          ./configure --prefix=/ucrt64 --enable-cxx --disable-all-drivers --enable-xsdk-xlogic --disable-python --disable-ruby --disable-java
          grep -q '^#define HAVE_HW_XSDK_XLOGIC 1' config.h
          make -j2
          make install
          pkg-config --modversion libsigrokcxx
      - name: Build Windows PulseView
        run: |
          set -eu
          cmake -S . -B pv-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DDISABLE_WERROR=ON -DENABLE_DECODE=OFF -DENABLE_TESTS=OFF
          cmake --build pv-build --target pulseview --parallel 2
          mkdir -p artifact
          cp pv-build/pulseview.exe artifact/
          plugin=$(pacman -Ql mingw-w64-ucrt-x86_64-qt5-base | awk '$2 ~ /\/platforms\/qwindows\.dll$/ {print $2}')
          mkdir -p artifact/platforms artifact/licenses
          cp "$plugin" artifact/platforms/
          cp COPYING artifact/licenses/PulseView.txt
          cp libsigrok-src/COPYING artifact/licenses/libsigrok.txt
          queue=(artifact/pulseview.exe artifact/platforms/qwindows.dll)
          for ((i=0; i<${#queue[@]}; ++i)); do
            while read -r dll; do
              if [[ -f "/ucrt64/bin/$dll" && ! -f "artifact/$dll" ]]; then
                cp "/ucrt64/bin/$dll" artifact/
                queue+=("artifact/$dll")
              fi
            done < <(objdump -p "${queue[i]}" | awk '/DLL Name:/ {print $3}' | tr -d '\r')
          done
          cp -r /ucrt64/share/licenses/mingw-w64-* artifact/licenses/ 2>/dev/null || true
      - name: Smoke test the staged Windows executable
        shell: pwsh
        run: |
          $env:Path = "$env:SystemRoot\System32;$env:SystemRoot"
          $env:QT_PLUGIN_PATH = $null
          $exe = (Resolve-Path artifact/pulseview.exe).Path
          $p = Start-Process -FilePath $exe -ArgumentList '--version' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "PulseView exited with $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: pulseview-xlogic-windows-x64-pilot
          path: artifact/
          retention-days: 7
