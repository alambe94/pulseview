name: Build PulseView artifacts

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

jobs:
  call-build-workflow:
    name: Sigrok artifact builder
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'provide_binaries'
    uses: sigrokproject/sigrok-build/.github/workflows/build.yml@master
